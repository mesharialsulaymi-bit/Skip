<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة متابعة الخطة الاستراتيجية</title>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a3f5c;--navy2:#0f2740;--gold:#b48a5f;--bg:#eef2f6;--card:#fff;--ink:#1c2b39;--mute:#5d6b78;--line:#dce4eb;--ok:#1d7a4f;--warn:#a86a00;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a2a;--card:#12283d;--ink:#e8eef3;--mute:#9db0c0;--line:#25405a;--ok:#5fd09a;--warn:#f0b955;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0b1a2a;--card:#12283d;--ink:#e8eef3;--mute:#9db0c0;--line:#25405a;--ok:#5fd09a;--warn:#f0b955;--bad:#ff8a80}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Somar Sans','Tajawal',Tahoma,sans-serif;line-height:1.7;font-size:15px}
header{background:var(--navy2);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
header img{height:38px}header b{font-size:17px}.sp{flex:1}
header input{font:inherit;padding:5px 10px;border-radius:8px;border:1px solid #38597a;background:#14314d;color:#fff}
.chip{background:#14314d;border:1px solid #38597a;border-radius:20px;padding:3px 12px;font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:6px 12px}
nav button{font:inherit;border:0;background:none;color:var(--mute);padding:8px 16px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--navy);color:#fff}
main{max-width:1180px;margin:0 auto;padding:18px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.c h3{margin:0 0 8px;font-size:16px;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .c h3{color:#e2c9a8}}
.big{font-size:30px;font-weight:800}.m{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse}th{background:var(--navy);color:#fff;text-align:right;padding:8px 10px;font-size:13px}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}.w{overflow-x:auto}
.st{display:inline-block;border-radius:14px;padding:1px 10px;font-size:12.5px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.nd,.ins{color:var(--mute)}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.f{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:8px}
label{display:block;font-size:13px;color:var(--mute)}label input,label select,label textarea{width:100%;display:block}
.b{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 18px;cursor:pointer;background:var(--navy);color:#fff}
.b.g2{background:var(--gold)}.b.o{background:none;border:1px solid var(--navy);color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b.o{color:#e2c9a8;border-color:#e2c9a8}}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.note{border-right:4px solid var(--gold);background:var(--card);padding:10px 14px;border-radius:8px;color:var(--mute);margin-bottom:12px;font-size:13.5px}
</style></head><body>

  doc:function(p){var i=p.indexOf('/'),c=p.slice(0,i),id=p.slice(i+1);return{set:function(d){return put(c,id,d)},update:function(u){return upd(c,id,u)},delete:function(){return sb.from('docs').delete().eq('col',c).eq('id',id).then(ck).then(function(){delete (rows[c]||{})[id];ntf(c)})},onSnapshot:function(f){sub(c,function(){f({data:function(){return (rows[c]||{})[id]}})})}}}}}

function loginUI(msg){$('app').innerHTML='<div class="c" style="max-width:420px;margin:30px auto"><h3>تسجيل الدخول</h3>'+(msg?'<div class="note">'+E(msg)+'</div>':'')+'<label>الاسم (للحساب الجديد)<input id="ln"></label><label style="margin-top:8px">البريد الإلكتروني<input id="le" type="email"></label><label style="margin-top:8px">كلمة المرور<input id="lp" type="password"></label><div style="margin-top:12px;display:flex;gap:8px"><button class="b" onclick="signIn()">دخول</button><button class="b o" onclick="signUp()">حساب جديد</button></div></div>';$('nav').innerHTML='';$('who').textContent='غير مسجّل'}
function signIn(){sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value}).then(function(r){if(r.error)loginUI('تعذر الدخول: '+r.error.message);else boot()})}
function signUp(){sb.auth.signUp({email:$('le').value.trim(),password:$('lp').value,options:{data:{name:$('ln').value.trim()}}}).then(function(r){if(r.error)loginUI('تعذر إنشاء الحساب: '+r.error.message);else if(!r.data.session)loginUI('تم إنشاء الحساب. افحص بريدك لتأكيده ثم ادخل.');else boot()})}
function boot(){sb.auth.getSession().then(function(r){var ses=r.data.session;if(!ses)return loginUI();
 var uid=ses.user.id;db=mkdb();usr=mkusr();
 return sb.from('docs').select('data').eq('col','users').eq('id',uid).maybeSingle().then(function(q){
  me={id:uid,owner:!!(q.data&&q.data.data&&q.data.data.role==='admin')};
  if(!$('so')){var b=document.createElement('button');b.id='so';b.className='chip';b.style.cursor='pointer';b.textContent='خروج';b.onclick=function(){sb.auth.signOut().then(function(){location.reload()})};$('who').after(b)}
  ['branches','depts','users','objs','inds','reps','reqs','evs'].forEach(function(c){db.collection(c).onSnapshot(function(s){S[c]={};s.docs.forEach(function(d){S[c][d.id]=d.data()});draw()})});
  db.doc('settings/main').onSnapshot(function(s){S.set.main=s.data()||{};draw()});db.doc('settings/cal').onSnapshot(function(s){S.set.cal=s.data()||{};draw()});
  sb.rpc('gate_info').then(function(g){S.gate=!!g.data;draw()});refreshAcc();refreshCodes();
  setInterval(refreshAcc,30000);draw()})})}
if(!CFG.url||!CFG.anon||/YOUR/.test(CFG.url)){$('app').innerHTML='<div class="c empty">عدّل ملف config.js وضع رابط Supabase والمفتاح العام (anon).</div>'}
else{sb=supabase.createClient(CFG.url,CFG.anon);sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')loginUI()});boot()}
</script></body></html>
